<title>COMET System Schematic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Fragment+Mono&display=swap">
<style>
/* Layout: one drafting sheet. Header strip, full-width schematic on an engineering grid, a row of scope probes,
   then data stream + build index. Build guides slide in from the right; signal domains carry fixed colours. */
:root{
  --bg:#eceee9; --sheet:#f8f9f6; --panel:#ffffff; --ink:#16202a; --muted:#566370; --rule:#c9d0ca; --grid:#e1e5df; --wire:#2a3745;
  --c-mu:#b3125c; --c-opt:#4f3fc4; --c-ana:#0a64a4; --c-dig:#985a00; --c-pwr:#bf3129; --c-dat:#0b7659; --c-mech:#665747;
  --ok:#1b7a3a; --bad:#b3261e; --on-mu:#ffffff; --accent:var(--c-opt);
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Fragment Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --drawer:min(560px,100vw);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1115; --sheet:#11181e; --panel:#161f26; --ink:#e2e7ea; --muted:#92a0aa; --rule:#29343d; --grid:#18212a; --wire:#b9c4cd;
  --c-mu:#ff5c9d; --c-opt:#a191ff; --c-ana:#56adef; --c-dig:#eea53a; --c-pwr:#ff7366; --c-dat:#3dcca1; --c-mech:#b8a48c;
  --ok:#5ccf86; --bad:#ff8a7f; --on-mu:#22030f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1115; --sheet:#11181e; --panel:#161f26; --ink:#e2e7ea; --muted:#92a0aa; --rule:#29343d; --grid:#18212a; --wire:#b9c4cd;
  --c-mu:#ff5c9d; --c-opt:#a191ff; --c-ana:#56adef; --c-dig:#eea53a; --c-pwr:#ff7366; --c-dat:#3dcca1; --c-mech:#b8a48c;
  --ok:#5ccf86; --bad:#ff8a7f; --on-mu:#22030f; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);overflow-x:clip}
.shell{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;transition:margin-right .25s ease}
@media (min-width:1100px){body.drawer-open .shell{margin-right:var(--drawer)}}
button{font:inherit;color:inherit}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 40px;align-items:end;padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-disp);font-weight:800;font-stretch:125%;font-size:clamp(46px,7.5vw,92px);line-height:.88;letter-spacing:-.015em;margin:8px 0 10px}
h1 .mu{color:var(--c-mu)}
.lede{max-width:62ch;color:var(--muted);margin:0;text-wrap:pretty}
.side{display:grid;gap:14px;justify-items:end}
@media (max-width:820px){.side{justify-items:start}}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 13px var(--f-body);font-stretch:88%;letter-spacing:.02em;padding:9px 14px;border-radius:5px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--c-mu);border-color:var(--c-mu);color:var(--on-mu)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.counters{display:flex;gap:26px;font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.counters b{display:block;font:400 26px var(--f-mono);letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.counters .c b{color:var(--c-mu)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 10px;font:10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:20px;height:3px;border-radius:2px;background:currentColor}
.legend span b{font-weight:400;color:var(--muted)}

/* schematic sheet */
.sheet{border:1px solid var(--rule);border-radius:4px;background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage{position:relative;min-width:980px}
.sheet svg{display:block;width:100%;height:auto}
.hint{font:11.5px var(--f-mono);color:var(--muted);margin:8px 0 0}
.wire{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;transition:stroke-width .15s}
.wire.hot{stroke-width:3.2}
.dash{stroke-dasharray:5 4}
.k-mu{stroke:var(--c-mu);color:var(--c-mu)} .k-opt{stroke:var(--c-opt);color:var(--c-opt)} .k-ana{stroke:var(--c-ana);color:var(--c-ana)}
.k-dig{stroke:var(--c-dig);color:var(--c-dig)} .k-pwr{stroke:var(--c-pwr);color:var(--c-pwr)} .k-dat{stroke:var(--c-dat);color:var(--c-dat)}
.k-mech{stroke:var(--c-mech);color:var(--c-mech)}
g.blk{stroke:none;cursor:pointer;outline:none}
.blk .bx{fill:var(--panel);stroke:currentColor;stroke-width:1.6;transition:fill .15s,stroke-width .15s}
.blk:hover .bx,.blk:focus-visible .bx{fill:color-mix(in srgb,currentColor 14%,var(--panel))}
.blk:focus-visible .bx,.blk.sel .bx{stroke-width:3.2}
.lb{font-family:var(--f-body);font-weight:650;font-stretch:80%;font-size:12.5px;letter-spacing:.05em;fill:var(--ink)}
.sl{font-family:var(--f-mono);font-size:9.8px;fill:var(--muted)}
.tiny{font-family:var(--f-mono);font-size:9px;fill:var(--muted);letter-spacing:.04em}
.halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.frame{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:7 5}
.tb{fill:var(--panel);stroke:var(--wire);stroke-width:1.2} .tbl{stroke:var(--wire);stroke-width:.8}
.slab{fill:var(--c-opt);fill-opacity:.16;transition:fill-opacity .25s} .slab.flash{fill-opacity:.6}
.hat{fill:url(#hatch);pointer-events:none}
.pin{stroke:var(--c-dat);stroke-width:1.3}
.tp circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4} .tp text{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink);font-weight:600}
.jn{fill:var(--c-dig)} .jn.a{fill:var(--c-ana)}
.gate-x{font-family:var(--f-mono);font-size:10px;fill:var(--bad);opacity:0;transition:opacity .2s} .gate-x.on{opacity:1}
.fx{pointer-events:none}

/* probes */
.sec{margin-top:40px}
.sec h2{font-family:var(--f-disp);font-stretch:112%;font-weight:750;font-size:23px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.sec .sub{color:var(--muted);margin:0 0 14px;max-width:70ch;font-size:14px}
.probes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.probe{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 12px 8px;transition:border-color .2s,box-shadow .2s;min-width:0}
.probe.live{border-color:var(--tpc);box-shadow:0 0 0 1px var(--tpc)}
.probe h3{margin:0;font:650 12px var(--f-body);font-stretch:85%;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.probe h3 .tpn{font-family:var(--f-mono);font-weight:400;color:var(--tpc)}
.probe p{margin:2px 0 0;font:10.5px var(--f-mono);color:var(--muted)}
.probe svg{display:block;width:100%;height:auto;margin-top:6px}
.ax{stroke:var(--rule);stroke-width:1;fill:none} .axl{font:8.5px var(--f-mono);fill:var(--muted)}
.trc{fill:none;stroke:var(--tpc);stroke-width:1.6;stroke-linejoin:round} .trc.b{stroke-dasharray:4 3;opacity:.7}
.thl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;font:12px var(--f-mono);margin-top:10px;font-variant-numeric:tabular-nums}
.rec span{color:var(--muted);display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase}

/* stream + index */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.log{background:var(--panel);border:1px solid var(--rule);border-radius:4px;font:11.5px/1.7 var(--f-mono);padding:10px 12px;height:260px;overflow:auto;white-space:pre;font-variant-numeric:tabular-nums}
.log:focus-visible{outline:2px solid var(--accent)}
.log .c{color:var(--muted)} .log .e{color:var(--c-dat)} .log .s{color:var(--c-dig)}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px 24px}
.grp h3{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.grp h3 i{width:9px;height:9px;border-radius:2px;background:currentColor;flex:none}
.grp ul{list-style:none;margin:0;padding:0}
.grp button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:5px 0;font-size:14px;border-bottom:1px dotted var(--rule)}
.grp button:hover{color:var(--accent)}
.grp button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);font:11px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

/* build-guide drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);background:var(--panel);border-left:1px solid var(--rule);
  box-shadow:-14px 0 36px rgb(0 0 0 / .14);transform:translateX(104%);visibility:hidden;
  transition:transform .25s ease,visibility 0s linear .25s;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.dh{position:relative;border-top:5px solid var(--dc);padding:calc(env(safe-area-inset-top,0px) + 16px) max(56px,calc(env(safe-area-inset-right,0px) + 48px)) 14px 22px;border-bottom:1px solid var(--rule)}
.dh .eyebrow{color:var(--dc)}
.dh h2{font-family:var(--f-disp);font-stretch:106%;font-weight:750;font-size:25px;line-height:1.12;margin:5px 0 0;text-wrap:balance}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:5px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;font-size:20px;line-height:1}
.x:focus-visible{outline:2px solid var(--accent)}
.db{padding:16px max(20px,env(safe-area-inset-right,0px)) 28px 22px;overflow-y:auto;flex:1;min-height:0}
.df{padding:10px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) 22px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.level{font:10.5px var(--f-mono);color:var(--muted);text-align:center}
.db h4{font:500 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 0 9px}
.db p{margin:0;max-width:65ch;text-wrap:pretty}
.io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;margin-top:16px}
.io div{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.4}
.io span{display:block;font:9.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.io .arr{border:0;align-self:center;padding:0;color:var(--dc);font:16px var(--f-mono)}
.specs,.chk,.warn{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.specs li{font:12.5px/1.5 var(--f-mono);padding-left:16px;position:relative}
.specs li::before{content:"";position:absolute;left:0;top:.65em;width:8px;height:2px;background:var(--dc)}
.chip{font:600 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid var(--dc);color:var(--dc);margin-left:6px;white-space:nowrap}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:11px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);font-size:14px}
ol.steps li::before{content:counter(s,decimal-leading-zero);font:12px var(--f-mono);color:var(--dc);padding-top:2px}
.tw{overflow-x:auto}
table.parts{width:100%;border-collapse:collapse;font-size:13px}
.parts td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.parts td:first-child{font:10.5px var(--f-mono);color:var(--muted);width:30%;padding-top:9px}
.parts .n{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chk li,.warn li{font-size:14px;padding-left:24px;position:relative}
.chk li::before{content:"";position:absolute;left:2px;top:.32em;width:11px;height:11px;border:1.5px solid var(--dc);border-radius:2px}
.warn li::before{content:"!";position:absolute;left:3px;top:.05em;font:700 13px var(--f-mono);color:var(--bad)}
.tool{margin-top:26px;border:1px solid var(--dc);border-radius:6px;padding:14px 14px 12px;background:color-mix(in srgb,var(--dc) 6%,var(--panel))}
.tool h4{margin:0 0 4px;color:var(--dc)}
.tool .note{font-size:12px;color:var(--muted);margin-top:8px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.row output,.row .u{font:12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.row input[type=range]{width:100%;accent-color:var(--dc)}
.row input[type=number]{width:100%;box-sizing:border-box;font:13px var(--f-mono);padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink)}
.row input:focus-visible{outline:2px solid var(--accent)}
.res{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:baseline;margin:12px 0 6px}
.big{font:400 30px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:12px;color:var(--muted)}
.lab{display:block;font:9.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table.mini{width:100%;border-collapse:collapse;font:12px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:8px}
.mini th{font-weight:400;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.mini td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule)}
.mini th:first-child,.mini td:first-child{text-align:left}
.tool svg{display:block;max-width:100%;height:auto;margin:6px auto 0}
.bar{height:10px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--dc)}
/* angle bar + rate charts */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px;padding:10px 14px;border:1px solid var(--rule);border-radius:5px;background:var(--panel)}
.tbar label{font:650 12px var(--f-body);font-stretch:85%;letter-spacing:.05em;text-transform:uppercase}
.tbar input[type=range]{width:clamp(140px,26vw,300px);accent-color:var(--c-mu)}
.tbar output{font:400 20px var(--f-mono);min-width:3.2ch;color:var(--c-mu);font-variant-numeric:tabular-nums}
.snaps{display:flex;flex-wrap:wrap;gap:4px}
.snaps button{font:12px var(--f-mono);padding:4px 8px;border-radius:4px;border:1px solid var(--rule);background:var(--panel);cursor:pointer}
.snaps button[aria-pressed="true"]{border-color:var(--c-mu);color:var(--c-mu);background:color-mix(in srgb,var(--c-mu) 10%,var(--panel))}
.snaps button:focus-visible,.tbar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.exp{font-size:13px;color:var(--muted)} .exp b{font:500 15px var(--f-mono);color:var(--ink)} .exp span{font-size:12px}
.sech{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px}
.sech .controls{margin-bottom:14px}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:10px}
@media (max-width:860px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:10px 14px 8px;min-width:0}
.chart h3{margin:0;font:650 12px var(--f-body);font-stretch:85%;letter-spacing:.05em;text-transform:uppercase}
.chart p{margin:3px 0 0;font:10.5px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.chart svg{display:block;width:100%;height:auto;margin-top:6px}
.ky{display:inline-block;width:16px;height:0;border-top:2px solid var(--c-mu);vertical-align:middle;margin-right:5px}
.ky.k2{border-top:1.5px dashed var(--muted)} .ky.k3{width:8px;height:8px;border:0;border-radius:50%;background:var(--c-dat)}
.ky.k4{width:10px;height:10px;border:0;background:var(--c-mu);opacity:.7} .ky.k5{border-top:1.5px dashed var(--ink)}
.cv1{fill:none;stroke:var(--c-mu);stroke-width:2;stroke-linejoin:round} .cv2{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 3}
.cur{stroke:var(--c-mu);stroke-width:1.2;stroke-dasharray:2 3} .curd{fill:var(--c-mu);stroke:var(--panel);stroke-width:2}
.eb{stroke:var(--c-dat);stroke-width:1.6} .md{fill:var(--c-dat);stroke:var(--panel);stroke-width:1.5}
.hb1{fill:var(--c-mu);fill-opacity:.7} .hb0{fill:var(--c-mu);fill-opacity:.25}
.exl{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3} .chg{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.halo2{paint-order:stroke;stroke:var(--panel);stroke-width:3px;fill:var(--ink)}
table.runs{margin-top:10px;background:var(--panel)} .runs tr.on td{color:var(--c-mu)}
.db p.lead{font-size:15.5px}
.how{display:grid;gap:12px;font-size:14.5px}
.how b,.chk b,.warn b,ol.steps b{font-weight:650}
.conn{display:grid;gap:8px}
.conn div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.conn span{font:10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dc);padding-top:3px}
.terms{margin:0;display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:7px 14px;font-size:13.5px}
.terms dt{font-weight:650} .terms dd{margin:0;color:var(--muted)}
.blk:hover .tb,.blk:focus-visible .tb{fill:color-mix(in srgb,var(--c-mu) 8%,var(--panel))}
.blk.sel .tb,.blk:focus-visible .tb{stroke:var(--c-mu);stroke-width:2}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;border-bottom:1.5px solid currentColor}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* detail sheets */
#sch{transition:opacity .25s ease} #sch.gone{opacity:0;pointer-events:none}
#det{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .3s ease,transform .3s ease}
#det.on{opacity:1;pointer-events:auto;transform:none}
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 8px;padding:8px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--panel)}
.crumb{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;flex:1;min-width:0}
.crumb b{font-family:var(--f-disp);font-weight:750;font-stretch:105%;font-size:16px}
.dhint{font:11px var(--f-mono);color:var(--muted)}
